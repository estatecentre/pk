<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estate Centre | Premier Real Estate Karachi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --brand: #0f766e;
      --brand-hover: #0d655e;
      --brand-light: #f0fdf4;
      --dark: #0f172a;
      --slate: #334155;
      --muted: #64748b;
      --line: #e2e8f0;
      --bg: #f8fafc;
      --white: #ffffff;
      --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; color: var(--slate); background: var(--bg); line-height: 1.5; }
    a { color: inherit; text-decoration: none; }
    .container { width: min(1200px, calc(100% - 32px)); margin: 0 auto; }

    /* Header */
    header { background: var(--white); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--line); }
    header .container { height: 64px; display: flex; align-items: center; justify-content: space-between; }
    .logo { font-weight: 800; font-size: 20px; color: var(--dark); letter-spacing: -0.5px; }
    .logo span { color: var(--brand); }
    .menu-toggle { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--dark); }

    /* Cards Grid Fix */
    section { padding: 40px 0; }
    .section-title { font-size: 24px; font-weight: 800; color: var(--dark); margin-bottom: 20px; text-align: center; }

    .cards-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
      gap: 20px; 
    }

    .property-card { 
      background: var(--white); 
      border-radius: var(--radius); 
      border: 1px solid var(--line); 
      overflow: hidden; 
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }

    .property-thumb { 
      position: relative; 
      width: 100%; 
      height: 200px; 
      background: #e2e8f0;
    }

    .property-thumb img { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
      display: block;
    }

    .property-badge { 
      position: absolute; 
      top: 12px; 
      left: 12px; 
      background: var(--brand); 
      color: var(--white); 
      font-size: 11px; 
      font-weight: 700; 
      padding: 4px 10px; 
      border-radius: 4px; 
      text-transform: uppercase; 
    }

    .property-content { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
    .property-agent { font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
    .property-type { color: var(--brand); font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 6px; }
    .property-title { font-size: 18px; font-weight: 700; color: var(--dark); margin-bottom: 16px; }
    
    .property-footer { 
      margin-top: auto; 
      padding-top: 12px; 
      border-top: 1px solid var(--line); 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }
    
    .property-price { font-size: 18px; font-weight: 800; color: var(--dark); }
    .property-price span { font-size: 10px; color: var(--muted); display: block; font-weight: 600; text-transform: uppercase; }
    .property-size { font-size: 12px; font-weight: 600; color: var(--slate); background: var(--bg); padding: 4px 8px; border-radius: 4px; }
  </style>
</head>
<body>

  <header>
    <div class="container">
      <a class="logo" href="#">ESTATE <span>CENTRE</span></a>
      <button class="menu-toggle">☰</button>
    </div>
  </header>

  <section>
    <div class="container">
      <h2 class="section-title">Featured Properties</h2>

      <div class="cards-grid">
        <!-- Property Card 1 -->
        <article class="property-card">
          <div class="property-thumb">
            <img src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=800&q=80" alt="Bungalow For Rent">
            <span class="property-badge">For Rent</span>
          </div>
          <div class="property-content">
            <div class="property-agent">◉ Agent Name</div>
            <div class="property-type">House</div>
            <h3 class="property-title">Bungalow For Rent</h3>
            <div class="property-footer">
              <div class="property-price"><span>PRICE</span>PKR 650,000</div>
              <span class="property-size">1000 Sq Yd</span>
            </div>
          </div>
        </article>

        <!-- Property Card 2 -->
        <article class="property-card">
          <div class="property-thumb">
            <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=800&q=80" alt="Portion For Rent">
            <span class="property-badge">For Rent</span>
          </div>
          <div class="property-content">
            <div class="property-agent">◉ Agent Name</div>
            <div class="property-type">Upper Portion</div>
            <h3 class="property-title">Portion For Rent</h3>
            <div class="property-footer">
              <div class="property-price"><span>PRICE</span>PKR 160,000</div>
              <span class="property-size">500 Sq Yd</span>
            </div>
          </div>
        </article>

        <!-- Property Card 3 -->
        <article class="property-card">
          <div class="property-thumb">
            <img src="https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=800&q=80" alt="Bungalow For Sale">
            <span class="property-badge">For Sale</span>
          </div>
          <div class="property-content">
            <div class="property-agent">◉ Agent Name</div>
            <div class="property-type">House</div>
            <h3 class="property-title">Bungalow For Sale</h3>
            <div class="property-footer">
              <div class="property-price"><span>PRICE</span>PKR 180,000,000</div>
              <span class="property-size">500 Sq Yd</span>
            </div>
          </div>
        </article>
      </div>
    </div>
  </section>

</body>
</html>
